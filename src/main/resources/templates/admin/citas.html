<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de citas')}"></head>
<body class="with-side">
<aside th:replace="~{fragments/layout :: side('citas')}"></aside>
<main class="content">
  <h1>Gestión de citas</h1><p class="sub">Confirma o cancela las citas del salón (30 días atrás a 90 días adelante)</p>
  <div class="chips">
    <a class="chip" th:classappend="${estado == null} ? 'on'" th:href="@{/admin/citas}" th:text="'Todas (' + ${nTODAS} + ')'">Todas</a>
    <a class="chip" th:classappend="${estado != null and estado.name() == 'PENDIENTE'} ? 'on'" th:href="@{/admin/citas(estado='PENDIENTE')}" th:text="'Pendientes (' + ${nPENDIENTE} + ')'">Pendientes</a>
    <a class="chip" th:classappend="${estado != null and estado.name() == 'CONFIRMADA'} ? 'on'" th:href="@{/admin/citas(estado='CONFIRMADA')}" th:text="'Confirmadas (' + ${nCONFIRMADA} + ')'">Confirmadas</a>
    <a class="chip" th:classappend="${estado != null and estado.name() == 'ATENDIDA'} ? 'on'" th:href="@{/admin/citas(estado='ATENDIDA')}" th:text="'Atendidas (' + ${nATENDIDA} + ')'">Atendidas</a>
    <a class="chip" th:classappend="${estado != null and estado.name() == 'CANCELADA'} ? 'on'" th:href="@{/admin/citas(estado='CANCELADA')}" th:text="'Canceladas (' + ${nCANCELADA} + ')'">Canceladas</a>
  </div>
  <div class="tablewrap"><table>
    <tr><th>FECHA</th><th>CLIENTE</th><th>SERVICIO</th><th>ESTILISTA</th><th>HORA</th><th>ESTADO</th><th>ACCIONES</th></tr>
    <tr th:each="c : ${citas}">
      <td th:text="${#temporals.format(c.fecha,'dd/MM/yyyy')}">fecha</td><td class="n" th:text="${c.cliente.nombreCompleto}">Cliente</td>
      <td th:text="${c.serviciosTexto}">Servicio</td><td th:text="${c.estilista.nombreCorto}">Estilista</td>
      <td th:text="${#temporals.format(c.horaInicio,'HH:mm')}">15:00</td>
      <td><span class="badge" th:classappend="${c.estado}" th:text="${c.estado}">PENDIENTE</span></td>
      <td><span class="acc" th:if="${c.estado.name() == 'PENDIENTE'}">
          <button class="t-ok" data-open-modal="m-confirmar" th:data-action="@{/admin/citas/{id}/confirmar(id=${c.id})}"
                  th:data-detalle="${c.cliente.nombreCompleto + ' para ' + c.serviciosTexto + ' el ' + #temporals.format(c.fecha,'dd/MM') + ' a las ' + #temporals.format(c.horaInicio,'HH:mm')}">Confirmar</button>
          <button class="t-warn" data-open-modal="m-cancelar" th:data-action="@{/citas/{id}/cancelar(id=${c.id})}" th:data-detalle="${c.cliente.nombreCompleto + ' — ' + c.serviciosTexto}">Cancelar</button></span>
        <span class="acc" th:if="${c.estado.name() == 'CONFIRMADA'}">
          <button class="t-warn" data-open-modal="m-cancelar" th:data-action="@{/citas/{id}/cancelar(id=${c.id})}" th:data-detalle="${c.cliente.nombreCompleto + ' — ' + c.serviciosTexto}">Cancelar</button></span>
        <span th:unless="${c.modificable}">—</span></td>
    </tr>
    <tr th:if="${#lists.isEmpty(citas)}"><td colspan="7" class="vacio">No hay citas con ese filtro.</td></tr>
  </table></div>
</main>
<th:block th:replace="~{admin/modales :: confirmar-cancelar('/admin/citas')}"></th:block>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
