<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servicios')}"></head>
<body class="with-side">
<aside th:replace="~{fragments/layout :: side('servicios')}"></aside>
<main class="content">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div><h1>Catálogo de servicios</h1><p class="sub">Gestiona precios, duración y disponibilidad</p></div>
    <button class="btn" data-open-modal="m-servicio" data-titulo="Nuevo servicio" th:data-action="@{/admin/servicios}"
            data-nombre="" data-descripcion="" data-precio="" data-min="" data-categoria="">+ Nuevo servicio</button>
  </div>
  <div class="okmsg" th:if="${param.guardado}">Servicio guardado.</div>
  <div class="errmsg" th:if="${param.error}">Revisa los datos: nombre, precio (≥ 0) y duración (≥ 5 min).</div>
  <div class="tablewrap"><table>
    <tr><th>SERVICIO</th><th>CATEGORÍA</th><th>DURACIÓN</th><th>PRECIO</th><th>ESTADO</th><th>ACCIONES</th></tr>
    <tr th:each="s : ${servicios}">
      <td class="n" th:text="${s.nombre}">Corte</td><td th:text="${s.categoria.nombre}">Corte</td><td th:text="${s.duracionMin + ' min'}">40 min</td>
      <td th:text="'S/ ' + ${#numbers.formatDecimal(s.precio,1,2)}">S/ 35.00</td>
      <td><span class="badge" th:classappend="${s.activo ? 'activo' : 'inactivo'}" th:text="${s.activo ? 'Activo' : 'Inactivo'}">Activo</span></td>
      <td><span class="acc">
        <button class="t-vino" data-open-modal="m-servicio" data-titulo="Editar servicio" th:data-action="@{/admin/servicios/{id}(id=${s.id})}"
                th:data-nombre="${s.nombre}" th:data-descripcion="${s.descripcion}" th:data-precio="${s.precio}" th:data-min="${s.duracionMin}" th:data-categoria="${s.categoria.id}">Editar</button>
        <form th:action="@{/admin/servicios/{id}/estado(id=${s.id})}" method="post"><input type="hidden" name="activo" th:value="${!s.activo}">
          <button class="t-warn" th:text="${s.activo ? 'Desactivar' : 'Activar'}">Desactivar</button></form></span></td>
    </tr>
  </table></div>
</main>
<dialog id="m-servicio">
  <h3 data-titulo>Servicio</h3>
  <form method="post" th:action="@{/admin/servicios}">
    <label>Nombre</label><input name="nombre" data-fill="nombre" required maxlength="80">
    <label>Descripción</label><input name="descripcion" data-fill="descripcion" maxlength="200">
    <div class="grid g3">
      <div><label>Categoría</label><select name="categoriaId" data-fill="categoria"><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option></select></div>
      <div><label>Duración (min)</label><input type="number" name="duracionMin" data-fill="min" min="5" required></div>
      <div><label>Precio (S/)</label><input type="number" step="0.01" min="0" name="precio" data-fill="precio" required></div>
    </div>
    <div class="modal-pie"><button type="button" class="btn sec" data-close>Cancelar</button><button class="btn">Guardar</button></div>
  </form>
</dialog>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
