spring.application.name=peluqueria-citas
# Perfil por defecto: "demo" (base H2 en memoria con datos de ejemplo, no requiere MySQL).
# Para MySQL: SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
spring.thymeleaf.cache=false
server.servlet.session.cookie.http-only=true
# Parametros de negocio
app.horarios.paso-minutos=30
app.recordatorio.horas=24,2
# Acceso de invitado: la reserva elegida antes de iniciar sesion se conserva este tiempo (minutos)
app.reserva-pendiente.minutos=30
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
